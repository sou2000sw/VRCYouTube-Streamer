<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="vrg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
  
  <!-- YouTube Screen Body -->
  <rect x="7" y="10" width="34" height="24" rx="6" fill="url(#vrg)"/>
  
  <!-- Play Triangle -->
  <polygon points="21,17 31,22 21,27" fill="#FFFFFF"/>
  
  <!-- Broadcast / Stream Waves -->
  <path d="M 14 38 Q 24 35 34 38" fill="none" stroke="url(#sig)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="40" r="1.5" fill="#38BDF8"/>
</svg>
